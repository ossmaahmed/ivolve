---
- name: Install Docker, kubectl and Jenkins
  hosts: myservers
  become: true
  vars:
    k8s_version: "v1.34"

  tasks:
    # ---------- Cleanup old repos with conflicting keys ----------
    - name: Remove old repo files that use conflicting keys
      shell: |
        grep -lE 'docker\.gpg|kubernetes-apt-keyring|jenkins-keyring' /etc/apt/sources.list.d/* 2>/dev/null | xargs -r rm -f
        sed -i -E '/docker\.gpg|kubernetes-apt-keyring|jenkins-keyring/d' /etc/apt/sources.list 2>/dev/null
        rm -f /etc/apt/keyrings/docker.gpg /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        rm -f /etc/apt/keyrings/jenkins-keyring.asc /usr/share/keyrings/jenkins-keyring.asc
        true
      changed_when: false

    - name: Install prerequisites
      apt:
        name: [ca-certificates, curl, gnupg, apt-transport-https]
        state: present
        update_cache: true

    - name: Create keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    # ---------- Docker (official repo) ----------
    - name: Remove conflicting Ubuntu docker packages
      apt:
        name: [docker.io, containerd, runc]
        state: absent

    - name: Add Docker GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        filename: docker
        state: present

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Start and enable Docker
      service:
        name: docker
        state: started
        enabled: true

    - name: Add user to docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    # ---------- kubectl ----------
    - name: Add Kubernetes GPG key
      get_url:
        url: "https://pkgs.k8s.io/core:/stable:/{{ k8s_version }}/deb/Release.key"
        dest: /etc/apt/keyrings/kubernetes.asc
        mode: "0644"

    - name: Add Kubernetes repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes.asc] https://pkgs.k8s.io/core:/stable:/{{ k8s_version }}/deb/ /"
        filename: kubernetes
        state: present

    - name: Install kubectl
      apt:
        name: kubectl
        state: present
        update_cache: true

    # ---------- Jenkins ----------
    - name: Install Java (required by Jenkins)
      apt:
        name: openjdk-21-jre
        state: present

    - name: Add Jenkins GPG key
      get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
        dest: /etc/apt/keyrings/jenkins-2026.asc
        mode: "0644"

    - name: Add Jenkins repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/jenkins-2026.asc] https://pkg.jenkins.io/debian-stable binary/"
        filename: jenkins
        state: present

    - name: Install Jenkins
      apt:
        name: jenkins
        state: present
        update_cache: true

    - name: Start and enable Jenkins
      service:
        name: jenkins
        state: started
        enabled: true
