---
- name: Remove old Kubernetes repo files that use conflicting keys
  shell: |
    grep -lE 'kubernetes-apt-keyring' /etc/apt/sources.list.d/* 2>/dev/null | xargs -r rm -f
    sed -i -E '/kubernetes-apt-keyring/d' /etc/apt/sources.list 2>/dev/null
    rm -f /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    true
  changed_when: false

- name: Install prerequisites
  apt:
    name: [ca-certificates, curl, gnupg, apt-transport-https]
    state: present
    update_cache: true

- name: Create keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Kubernetes GPG key
  get_url:
    url: "https://pkgs.k8s.io/core:/stable:/{{ k8s_version }}/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes.asc
    mode: "0644"

- name: Add Kubernetes repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes.asc] https://pkgs.k8s.io/core:/stable:/{{ k8s_version }}/deb/ /"
    filename: kubernetes
    state: present

- name: Install kubectl
  apt:
    name: kubectl
    state: present
    update_cache: true
