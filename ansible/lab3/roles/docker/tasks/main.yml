---
- name: Remove old Docker repo files that use conflicting keys
  shell: |
    grep -lE 'docker\.gpg' /etc/apt/sources.list.d/* 2>/dev/null | xargs -r rm -f
    sed -i -E '/docker\.gpg/d' /etc/apt/sources.list 2>/dev/null
    rm -f /etc/apt/keyrings/docker.gpg
    true
  changed_when: false

- name: Install prerequisites
  apt:
    name: [ca-certificates, curl, gnupg, apt-transport-https]
    state: present
    update_cache: true

- name: Create keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Remove conflicting Ubuntu docker packages
  apt:
    name: [docker.io, containerd, runc]
    state: absent

- name: Add Docker GPG key
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker repository
  apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    filename: docker
    state: present

- name: Install Docker
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Start and enable Docker
  service:
    name: docker
    state: started
    enabled: true

- name: Add user to docker group
  user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
